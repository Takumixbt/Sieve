# Sieve defaults. Override per user in ~/.sieve/sieve.yaml and per engagement in <target>/.sieve/sieve.yaml.
# Later files win; maps are merged key by key. Paths accept ~ and $ENV_VARS.
version: 1

user_home: ~/.sieve

# ---------------------------------------------------------------- knowledge base
# One Obsidian vault for everything Sieve writes: the knowledge base under KB/ and each engagement under
# Engagements/<target>/. Resolved as $SIEVE_VAULT, then `vault.root` below, then "Sieve Vault" in Documents
# (OneDrive's Documents when that is where Documents lives), then ~/.sieve/vault. Point it at a local-only,
# non-synced folder for a confidential engagement (or use `sieve vault export --local`).
vault:
  root: ""

kb:
  # Plain markdown cards with YAML frontmatter, wired for Obsidian: `sieve vault init` scaffolds the vault and
  # every card carries [[wikilinks]] (vector, class, domain, engagements). `auto` means <vault root>/KB.
  vault: auto
  index: ~/.sieve/index.db
  sources:
    seed:
      enabled: true            # cards and datasets shipped in kb/seed
    public:
      enabled: true            # `sieve kb ingest`: keyless public precedents (see `sieve kb sources`); no config needed
    solodit:
      enabled: true            # OPTIONAL: needs an API key (solodit.cyfrin.io -> profile -> API keys); skipped when unset
      endpoint: https://solodit.cyfrin.io/api/v1/solodit/findings
      api_key_env: CYFRIN_API_KEY
      rate_limit: {requests: 20, per_seconds: 60}
      cache_ttl: {search: 300, finding: 3600}
      page_size: 20
    osv:
      enabled: true            # library/CVE lookups by package + version, no key needed
      endpoint: https://api.osv.dev/v1/query
      rate_limit: {requests: 60, per_seconds: 60}
      cache_ttl: {search: 3600}
    nvd:
      enabled: false
      endpoint: https://services.nvd.nist.gov/rest/json/cves/2.0
      api_key_env: NVD_API_KEY
      rate_limit: {requests: 5, per_seconds: 30}
      cache_ttl: {search: 3600}
  writeback:
    curated: true              # precedents an agent fetched AND used become cards (status: curated)
    confirmed: true            # own gate-passed findings become cards (status: confirmed)
    lessons: true              # killed hypotheses (frontier rows closed dead) become lesson cards
    min_confidence: 75
    sanitize: true             # refuse to write secrets/keys/PII into cards

# ---------------------------------------------------------------- tools and external services the audit reaches for
tools:
  burp:
    proxy: 127.0.0.1:8080        # where Burp's proxy listener answers; the browser routes through it
    mcp: 127.0.0.1:13337         # Burp's MCP server (the MCP tab shows the real host and port)
  etherscan_key_file: ~/.claude/secrets/etherscan_api_key.txt   # presence is checked, the value is never printed

external:
  v12:                         # an independent automated audit, folded in as LEADS (never findings); see SKILL.md Turn 3
    enabled: true
    max_cost_cents: 3000       # the agent runs v12_estimate_cost first and only launches when the quote is at or under this
    max_lines: 60000           # and only for a scope up to this many lines

# ---------------------------------------------------------------- persistence (anti-laziness)
persistence:
  min_dead_attempts: 3         # a dead end needs at least this many logged attempts...
  min_distinct_rungs: 3        # ...spread over at least this many different ladder rungs
  max_blocks: 60               # hard cap on Stop-hook blocks per engagement
  no_progress_release: 4       # release after this many consecutive blocks with zero progress
  max_minutes: 240             # wall-clock budget for the engagement
  wait_release_minutes: 45     # allowed idle time while background agents run
  block_permission_endings: true

# ---------------------------------------------------------------- audit behaviour
audit:
  passes: 3
  max_passes: 10
  confidence_threshold: 75
  size_trigger: 20             # more findings than this: terminal prints top 3 + the report path
  hypothesis_quota:
    min_total: 8               # per agent output file - references/methodology.md Part 0
    min_techniques: 4          # distinct ideation techniques - methodology.md Part 3
    min_moonshots: 1
  markers:                     # mandatory reasoning markers - methodology.md Part 1
    feynman: {base: 3, per_kloc: 2, cap: 40}
    socratic: {base: 2, per_kloc: 1, cap: 25}
    inversion: {base: 3, per_kloc: 2, cap: 40}

# ---------------------------------------------------------------- outputs
report:
  formats: [md, html]          # add pdf when Chromium is available (sieve doctor shows this)
  classification: Confidential
  author: ""
  organisation: ""
  severity_basis:
    web3: impact-likelihood
    web: cvss
    binary: cvss

map:
  overlay: true                # colour nodes by audit coverage and badge them with findings
